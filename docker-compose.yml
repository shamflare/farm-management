services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
    ports:
      - "5432:5432"
    volumes:
      - farm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farm_pgdata:
