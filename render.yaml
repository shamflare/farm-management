# Render blueprint: one API, one dashboard, one database — all on free plans.
# Create it from the Render dashboard: New → Blueprint → pick this repository.
#
# Free plans sleep after 15 minutes of inactivity, so the first visit after a
# quiet spell waits for both services to wake. The free database is deleted by
# Render 30 days after it is created.

databases:
  - name: farm-db
    databaseName: farm
    user: farm
    plan: free
    region: frankfurt

services:
  # --- Django API -------------------------------------------------------
  - type: web
    name: farm-api
    runtime: python
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health/
    # Migrating and seeding at build time keeps them off the wake-up path, so a
    # sleeping service comes back in seconds rather than re-running them.
    buildCommand: |
      pip install -r requirements.txt
      cd backend
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py bootstrap_demo
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FARM_TIMEZONE
        value: Asia/Damascus
      # Set this in the Render dashboard before the first deploy — it replaces
      # the seed's well-known password on every boot.
      - key: DEMO_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: farm-db
          property: connectionString

  # --- Next.js dashboard ------------------------------------------------
  - type: web
    name: farm-admin
    runtime: node
    plan: free
    region: frankfurt
    rootDir: admin-web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # The blueprint can hand over a hostname but not a full URL, so
      # next.config.ts builds https://<host>/api/v1 out of this.
      - key: API_HOST
        fromService:
          type: web
          name: farm-api
          property: host
